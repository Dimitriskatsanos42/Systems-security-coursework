name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - Linux-user-management
          - assignment-1-hashing-2fa
          - assignment-2-secure-storage
          - password-strength-checker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check project folder exists
        id: check
        run: |
          if [ -d "${{ matrix.project }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install flake8 pytest

      - name: Lint with flake8
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.project }}
        run: |
          flake8 . --count --max-line-length=120 --statistics \
            --exclude=venv,.venv,build,dist

      - name: Run tests (if any)
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.project }}
        run: |
          if [ -d tests ] || ls test_*.py *_test.py 1> /dev/null 2>&1; then
            pytest -v
          else
            echo "No tests found for ${{ matrix.project }} — skipping test step."
          fi
